openapi: 3.1.0
info:
  title: Canopy engine API
  version: 0.1.0
  description: >-
    Contract between the Canopy web app and the engine. Single source of truth: Go server
    interfaces and the TypeScript client + Zod schemas are generated from this file.
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      operationId: getLiveness
      summary: Liveness of the engine process
      description: Never touches dependencies; used by container health checks.
      tags: [system]
      responses:
        '200':
          description: The process is running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LivenessStatus'
  /readyz:
    get:
      operationId: getReadiness
      summary: Readiness of the engine and its database
      tags: [system]
      responses:
        '200':
          description: The engine can serve requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessStatus'
        '503':
          description: A dependency is unavailable (code `system.database_unavailable`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/fs/list:
    get:
      operationId: listDirectory
      summary: List a directory the caller may see
      description: >-
        Entries the caller may read (or traverse towards a granted folder), sorted folders first.
        Each entry carries the path actions the caller holds on it, so the UI never re-implements
        permission logic. Host paths never appear.
      tags: [files]
      security:
        - engineToken: []
      parameters:
        - name: path
          in: query
          required: true
          description: Virtual POSIX path (`/media/photos`).
          schema:
            type: string
            maxLength: 4096
        - name: dirsOnly
          in: query
          description: Only folders (folder pickers).
          schema:
            type: boolean
            default: false
        - name: sort
          in: query
          schema:
            type: string
            enum: [name, size, modified]
            default: name
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: asc
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        '200':
          description: One page of the directory.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectoryListing'
        '400':
          description: Invalid path or parameters (`files.invalid_path`, `system.bad_request`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid engine token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The caller may not see this folder (`files.forbidden`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such folder (`files.not_found`, `files.not_a_directory`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/authz/explain:
    post:
      operationId: explainAccess
      summary: Explain a person's access to a folder
      description: >-
        For each path action, whether the given person (and their groups) may do it on the path
        and which rule decided. Only for callers holding `users:read`; used by the user access
        page so administrators can trace permissions with the engine's own resolution.
      tags: [authz]
      security:
        - engineToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExplainRequest'
      responses:
        '200':
          description: One decision per action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExplainResponse'
        '400':
          description: Invalid path (`files.invalid_path`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid engine token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The caller may not inspect access (`auth.forbidden`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/jobs/folder-size:
    post:
      operationId: startFolderSize
      summary: Measure a folder in the background
      description: >-
        Starts a job adding up the size of every file the caller may read under the folder.
        Subfolders the caller may not read are skipped. Progress streams on `GET /v1/jobs/events`
        (Server-Sent Events, `event: job`, data is a `Job`).
      tags: [jobs]
      security:
        - engineToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FolderSizeRequest'
      responses:
        '202':
          description: The job was queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          description: Invalid path (`files.invalid_path`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid engine token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The caller may not read this folder (`files.forbidden`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such folder (`files.not_found`, `files.not_a_directory`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many active jobs for this person (`jobs.too_many`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/jobs:
    get:
      operationId: listJobs
      summary: Recent jobs of the caller
      description: Newest first. Administrators see every job.
      tags: [jobs]
      security:
        - engineToken: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: Jobs, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobList'
        '401':
          description: Missing or invalid engine token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/jobs/{jobId}:
    get:
      operationId: getJob
      summary: One job
      tags: [jobs]
      security:
        - engineToken: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '401':
          description: Missing or invalid engine token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such job, or not the caller’s (`jobs.not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/jobs/{jobId}/cancel:
    post:
      operationId: cancelJob
      summary: Cancel a queued or running job
      description: >-
        A queued job is cancelled at once; a running one stops as soon as it notices (its final
        state arrives on the event stream).
      tags: [jobs]
      security:
        - engineToken: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '202':
          description: Cancellation requested.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '401':
          description: Missing or invalid engine token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such job, or not the caller’s (`jobs.not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The job already finished (`jobs.not_cancellable`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/jobs/{jobId}/logs:
    get:
      operationId: getJobLogs
      summary: Output lines of a job
      description: The last lines kept (capped per job), after an optional sequence number.
      tags: [jobs]
      security:
        - engineToken: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: after
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Lines in order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobLogList'
        '401':
          description: Missing or invalid engine token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such job, or not the caller’s (`jobs.not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    engineToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived Ed25519 token signed by the web app (never by browsers).
  schemas:
    LivenessStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    ReadinessStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ready]
    Error:
      description: >-
        Shared error model. `code` is namespaced `<module>.<error>` and translated by the UI
        (`errors.<code>`); no human message is ever sent.
      type: object
      required: [code, params, requestId]
      properties:
        code:
          type: string
          pattern: '^[a-z]+\.[a-z_]+$'
          examples: [system.database_unavailable]
        params:
          description: Interpolation values for the translated message (strings or numbers).
          type: object
          additionalProperties: true
        requestId:
          type: string
    PathAction:
      type: string
      enum: [read, upload, create, update, move, copy, delete, download, share, execute]
    DirectoryEntry:
      type: object
      required: [name, path, kind, size, modified, actions]
      properties:
        name:
          type: string
        path:
          description: Virtual path of the entry.
          type: string
        kind:
          type: string
          enum: [file, directory]
        size:
          description: Bytes (0 for folders).
          type: integer
          format: int64
        modified:
          type: string
          format: date-time
        actions:
          type: array
          items:
            $ref: '#/components/schemas/PathAction'
    DirectoryListing:
      type: object
      required: [path, entries, total, actions]
      properties:
        path:
          type: string
        entries:
          type: array
          items:
            $ref: '#/components/schemas/DirectoryEntry'
        total:
          description: Visible entries in the whole folder (for pagination).
          type: integer
        actions:
          description: Path actions the caller holds on the listed folder itself.
          type: array
          items:
            $ref: '#/components/schemas/PathAction'
    ExplainRequest:
      type: object
      required: [userId, groups, admin, path]
      properties:
        userId:
          type: string
        groups:
          description: Ids of the person's groups.
          type: array
          items:
            type: string
        admin:
          description: The person holds `system:admin` (bypasses rules).
          type: boolean
        path:
          type: string
          maxLength: 4096
    DecidingGrant:
      type: object
      required: [id, subjectType, subjectId, path, effect]
      properties:
        id:
          type: string
        subjectType:
          type: string
          enum: [user, group]
        subjectId:
          type: string
        path:
          type: string
        effect:
          type: string
          enum: [allow, deny]
    AccessDecision:
      type: object
      required: [action, allowed, byAdmin]
      properties:
        action:
          $ref: '#/components/schemas/PathAction'
        allowed:
          type: boolean
        byAdmin:
          type: boolean
        grant:
          $ref: '#/components/schemas/DecidingGrant'
    ExplainResponse:
      type: object
      required: [path, decisions]
      properties:
        path:
          type: string
        decisions:
          type: array
          items:
            $ref: '#/components/schemas/AccessDecision'
    FolderSizeRequest:
      type: object
      required: [path]
      properties:
        path:
          type: string
    JobState:
      type: string
      enum: [queued, running, succeeded, failed, cancelled]
    Job:
      type: object
      required: [id, kind, ownerId, state, bytesDone, itemsDone, createdAt]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          description: What the job does (`folder_size`, later copy, move, delete…).
        ownerId:
          type: string
        state:
          $ref: '#/components/schemas/JobState'
        target:
          type: string
          description: Virtual path the job works on.
        bytesDone:
          type: integer
          format: int64
        bytesTotal:
          type: integer
          format: int64
          description: Absent while still unknown.
        itemsDone:
          type: integer
          format: int64
        itemsTotal:
          type: integer
          format: int64
        currentPath:
          type: string
        rateBps:
          type: integer
          format: int64
        etaSeconds:
          type: integer
        result:
          type: object
          additionalProperties: true
          description: Human-readable outcome, shape depends on the kind.
        errorCode:
          type: string
          description: Set when the job failed; translated by the web app.
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
    JobList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Job'
    JobLogLine:
      type: object
      required: [seq, at, level, line]
      properties:
        seq:
          type: integer
        at:
          type: string
          format: date-time
        level:
          type: string
          enum: [info, warn, error]
        line:
          type: string
    JobLogList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/JobLogLine'
