openapi: 3.1.0
info:
  title: Canopy engine API
  version: 0.1.0
  description: >-
    Contract between the Canopy web app and the engine. Single source of truth: Go server
    interfaces and the TypeScript client + Zod schemas are generated from this file.
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      operationId: getLiveness
      summary: Liveness of the engine process
      description: Never touches dependencies; used by container health checks.
      tags: [system]
      responses:
        '200':
          description: The process is running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LivenessStatus'
  /readyz:
    get:
      operationId: getReadiness
      summary: Readiness of the engine and its database
      tags: [system]
      responses:
        '200':
          description: The engine can serve requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessStatus'
        '503':
          description: A dependency is unavailable (code `system.database_unavailable`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/fs/list:
    get:
      operationId: listDirectory
      summary: List a directory the caller may see
      description: >-
        Entries the caller may read (or traverse towards a granted folder), sorted folders first.
        Each entry carries the path actions the caller holds on it, so the UI never re-implements
        permission logic. Host paths never appear.
      tags: [files]
      security:
        - engineToken: []
      parameters:
        - name: path
          in: query
          required: true
          description: Virtual POSIX path (`/media/photos`).
          schema:
            type: string
            maxLength: 4096
        - name: dirsOnly
          in: query
          description: Only folders (folder pickers).
          schema:
            type: boolean
            default: false
        - name: sort
          in: query
          schema:
            type: string
            enum: [name, size, modified]
            default: name
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: asc
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        '200':
          description: One page of the directory.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectoryListing'
        '400':
          description: Invalid path or parameters (`files.invalid_path`, `system.bad_request`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid engine token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The caller may not see this folder (`files.forbidden`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such folder (`files.not_found`, `files.not_a_directory`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/fs/entry:
    get:
      operationId: statEntry
      summary: Describe one file or folder
      description: >-
        The entry as a listing would show it (actions, preview, thumbnail), when the caller may see
        it. Used before acting on a single path (sharing) and by share links.
      tags: [files]
      security:
        - engineToken: []
      parameters:
        - name: path
          in: query
          required: true
          schema:
            type: string
            maxLength: 4096
      responses:
        '200':
          description: The entry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectoryEntry'
        '400':
          description: Invalid path (`files.invalid_path`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid engine token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such entry, or one the caller may not see (`files.not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/fs/properties:
    get:
      operationId: getEntryProperties
      summary: Details of one file or folder for the Properties dialog
      description: >-
        The entry as a listing shows it, plus what the host knows about it: type, permission bits,
        numeric owner, last metadata change and, for a symbolic link, its relative target.
        Visible entries only; reading changes nothing, so it is not audited.
      tags: [files]
      security:
        - engineToken: []
      parameters:
        - name: path
          in: query
          required: true
          schema:
            type: string
            maxLength: 4096
      responses:
        '200':
          description: The details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntryProperties'
        '400':
          description: Invalid path (`files.invalid_path`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid engine token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such entry, or one the caller may not see (`files.not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/fs/media:
    get:
      operationId: getMediaInfo
      summary: How a video can be played in the browser
      description: >-
        Codecs and duration (read with ffprobe when the engine has it) and the cheapest way to
        play the file: as stored (`direct`), or streamed by the engine as fragmented MP4 from
        `/v1/fs/stream?path=&start=`, copying the video (`remux`) or re-encoding it (`transcode`).
        `streamable` is false when the engine has no ffmpeg.
      tags: [files]
      security:
        - engineToken: []
      parameters:
        - name: path
          in: query
          required: true
          schema:
            type: string
            maxLength: 4096
      responses:
        '200':
          description: How to play it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaInfo'
        '400':
          description: Invalid path, or not a video (`files.invalid_path`, `media.unreadable`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid engine token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The caller may not download this file (`auth.forbidden`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such file (`files.not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/fs/search:
    get:
      operationId: searchFiles
      summary: Find files and folders by name under a folder
      description: >-
        Walks the tree under `path` (only where the caller may see) and returns entries whose name
        contains every word of `q`, ignoring case and accents. The walk has hard limits; when one
        is reached, `truncated` says which and the results are what was found so far.
      tags: [files]
      security:
        - engineToken: []
      parameters:
        - name: path
          in: query
          required: true
          description: Folder to search in (`/` for every volume).
          schema:
            type: string
            maxLength: 4096
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 200
      responses:
        '200':
          description: The matching entries, best first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResults'
        '400':
          description: Invalid path or query (`files.invalid_path`, `files.invalid_query`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid engine token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The caller may not see this folder (`files.forbidden`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such folder (`files.not_found`, `files.not_a_directory`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/authz/explain:
    post:
      operationId: explainAccess
      summary: Explain a person's access to a folder
      description: >-
        For each path action, whether the given person (and their groups) may do it on the path
        and which rule decided. Only for callers holding `users:read`; used by the user access
        page so administrators can trace permissions with the engine's own resolution.
      tags: [authz]
      security:
        - engineToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExplainRequest'
      responses:
        '200':
          description: One decision per action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExplainResponse'
        '400':
          description: Invalid path (`files.invalid_path`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid engine token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The caller may not inspect access (`auth.forbidden`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/jobs/compress:
    post:
      operationId: startCompress
      summary: Compress items into an archive
      description: >-
        Starts a job writing a zip or tar.gz of the sources into the folder that holds them (never replacing anything: a free name is picked). What the caller may not read is left out; links are skipped. The result carries the archive path.
      tags: [jobs]
      security:
        - engineToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompressRequest'
      responses:
        '202':
          description: The job was queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          description: Invalid paths or format, or sources in different folders (`files.invalid_path`, `files.mixed_folders`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid engine token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The caller may not copy a source or create in the folder (`files.forbidden`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: A source does not exist (`files.not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many active jobs for this person (`jobs.too_many`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/jobs/extract:
    post:
      operationId: startExtract
      summary: Extract an archive next to it
      description: >-
        Starts a job unpacking a zip, tar or tar.gz into a new folder next to it. Unsafe entry names fail the job (`files.bad_archive`); links and devices are skipped; extraction stops past the free space or 200 000 entries (`files.archive_too_large`). The result carries the folder path.
      tags: [jobs]
      security:
        - engineToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtractRequest'
      responses:
        '202':
          description: The job was queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          description: Invalid path, or not an archive (`files.invalid_path`, `files.not_archive`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid engine token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The caller may not copy the archive or create in its folder (`files.forbidden`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such file (`files.not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many active jobs for this person (`jobs.too_many`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/jobs/checksum:
    post:
      operationId: startChecksum
      summary: Compute a file checksum
      description: >-
        Starts a job hashing one file (MD5, SHA-1, SHA-256 or SHA-512). The result carries the hex digest.
      tags: [jobs]
      security:
        - engineToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChecksumRequest'
      responses:
        '202':
          description: The job was queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          description: Invalid path or algorithm (`files.invalid_path`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid engine token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The caller may not download this file (`files.forbidden`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such file (`files.not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many active jobs for this person (`jobs.too_many`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/plugins:
    get:
      operationId: listPlugins
      summary: Installed plugins
      description: Administrators only. Also says which platform this engine runs on.
      tags: [plugins]
      security:
        - engineToken: []
      responses:
        '200':
          description: The plugins.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginList'
        '401':
          description: Missing or invalid engine token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Administrators only (`auth.forbidden`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: installPlugin
      summary: Install or update a plugin from its release files
      description: >-
        Administrators only. The web app downloads the release (the engine has no internet access)
        and sends its `canopy-plugin.yaml`, its checksum file and the binary for this platform.
        The manifest is checked strictly and the binary's SHA-256 must match the checksum file
        before anything is stored; no install script ever runs.
      tags: [plugins]
      security:
        - engineToken: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [manifest, checksums, binary]
              properties:
                manifest:
                  type: string
                checksums:
                  type: string
                binary:
                  type: string
                  format: binary
      responses:
        '201':
          description: Installed and active.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plugin'
        '400':
          description: Refused (`plugins.invalid_manifest`, `plugins.checksum_mismatch`, `plugins.unsupported_platform`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid engine token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Administrators only (`auth.forbidden`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/plugins/inspect:
    post:
      operationId: inspectPlugin
      summary: Check a release manifest before downloading its binary
      description: >-
        Administrators only. Checks a `canopy-plugin.yaml` strictly and names the release assets
        to download for this engine's platform, so a bad release is refused before any binary is
        fetched.
      tags: [plugins]
      security:
        - engineToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PluginManifestText'
      responses:
        '200':
          description: The release as it would install.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginRelease'
        '400':
          description: Refused (`plugins.invalid_manifest`, `plugins.unsupported_platform`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid engine token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Administrators only (`auth.forbidden`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/plugins/{pluginId}:
    patch:
      operationId: updatePlugin
      summary: Enable, disable, pin or unpin a plugin
      tags: [plugins]
      security:
        - engineToken: []
      parameters:
        - name: pluginId
          in: path
          required: true
          schema:
            type: string
            maxLength: 32
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PluginFlags'
      responses:
        '200':
          description: The plugin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plugin'
        '401':
          description: Missing or invalid engine token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Administrators only (`auth.forbidden`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such plugin (`plugins.not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: uninstallPlugin
      summary: Uninstall a plugin
      tags: [plugins]
      security:
        - engineToken: []
      parameters:
        - name: pluginId
          in: path
          required: true
          schema:
            type: string
            maxLength: 32
      responses:
        '204':
          description: Removed with its commands and files.
        '401':
          description: Missing or invalid engine token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Administrators only (`auth.forbidden`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such plugin (`plugins.not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/commands:
    get:
      operationId: listCommands
      summary: Catalog commands the caller may run
      description: >-
        Installed catalog entries: basic ones for everyone, advanced ones when advanced mode is on
        and the caller holds `commands:advanced`. There is no free-text command anywhere.
      tags: [commands]
      security:
        - engineToken: []
      responses:
        '200':
          description: The visible entries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandCatalog'
        '401':
          description: Missing or invalid engine token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/commands/preview:
    post:
      operationId: previewCommand
      summary: Show the exact arguments a run would use
      description: >-
        Validates the parameters exactly as a run would (types, ranges, path rights) and returns the
        argument list, secrets hidden. Nothing runs.
      tags: [commands]
      security:
        - engineToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommandRequest'
      responses:
        '200':
          description: The arguments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandPreview'
        '400':
          description: Invalid parameters (`commands.unknown_param`, `commands.missing_param`, `commands.invalid_value`, `commands.no_dry_run`, `files.invalid_path`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid engine token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not allowed (`files.forbidden`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such command, or not available to the caller (`commands.unavailable`, `files.not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/jobs/command:
    post:
      operationId: startCommand
      summary: Run a catalog command
      description: >-
        Starts a job running the entry with the given parameters (checked like a preview), without a
        shell, with a scrubbed environment, lower priority and the entry's timeout. Output streams
        to the job log (capped, secrets hidden) and progress to the job.
      tags: [jobs]
      security:
        - engineToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommandRequest'
      responses:
        '202':
          description: The job was queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          description: Invalid parameters (see previewCommand).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid engine token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not allowed (`files.forbidden`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such command (`commands.unavailable`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many active jobs for this person (`jobs.too_many`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/jobs/folder-size:
    post:
      operationId: startFolderSize
      summary: Measure a folder in the background
      description: >-
        Starts a job adding up the size of every file the caller may read under the folder.
        Subfolders the caller may not read are skipped. Progress streams on `GET /v1/jobs/events`
        (Server-Sent Events, `event: job`, data is a `Job`).
      tags: [jobs]
      security:
        - engineToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FolderSizeRequest'
      responses:
        '202':
          description: The job was queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          description: Invalid path (`files.invalid_path`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid engine token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The caller may not read this folder (`files.forbidden`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such folder (`files.not_found`, `files.not_a_directory`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many active jobs for this person (`jobs.too_many`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/jobs:
    get:
      operationId: listJobs
      summary: Recent jobs of the caller
      description: Newest first. Administrators see every job.
      tags: [jobs]
      security:
        - engineToken: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: Jobs, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobList'
        '401':
          description: Missing or invalid engine token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/jobs/{jobId}:
    get:
      operationId: getJob
      summary: One job
      tags: [jobs]
      security:
        - engineToken: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '401':
          description: Missing or invalid engine token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such job, or not the caller’s (`jobs.not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/jobs/{jobId}/cancel:
    post:
      operationId: cancelJob
      summary: Cancel a queued or running job
      description: >-
        A queued job is cancelled at once; a running one stops as soon as it notices (its final
        state arrives on the event stream).
      tags: [jobs]
      security:
        - engineToken: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '202':
          description: Cancellation requested.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '401':
          description: Missing or invalid engine token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such job, or not the caller’s (`jobs.not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The job already finished (`jobs.not_cancellable`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/jobs/{jobId}/logs:
    get:
      operationId: getJobLogs
      summary: Output lines of a job
      description: The last lines kept (capped per job), after an optional sequence number.
      tags: [jobs]
      security:
        - engineToken: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: after
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Lines in order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobLogList'
        '401':
          description: Missing or invalid engine token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such job, or not the caller’s (`jobs.not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/fs/mkdir:
    post:
      operationId: createFolder
      summary: Create a folder
      description: Needs `create` on the new path. The parent must exist.
      tags: [files]
      security:
        - engineToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFolderRequest'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PathResult'
        '400':
          description: Invalid path or name (`files.invalid_path`, `files.invalid_name`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid engine token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not allowed (`files.forbidden`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Parent folder missing (`files.not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Name taken (`files.exists`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/fs/rename:
    post:
      operationId: renameEntry
      summary: Rename an entry in place
      description: Needs `update` on the entry. Never replaces an existing name.
      tags: [files]
      security:
        - engineToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameRequest'
      responses:
        '200':
          description: Renamed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PathResult'
        '400':
          description: Invalid path or name (`files.invalid_path`, `files.invalid_name`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid engine token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not allowed (`files.forbidden`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Entry missing (`files.not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Name taken (`files.exists`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/fs/transfer/plan:
    post:
      operationId: planTransfer
      summary: Check a copy or move before running it
      description: >-
        Validates the transfer and lists targets that already exist (descending into folders that
        would merge, capped), so a strategy can be chosen per item. Nothing is written.
      tags: [files]
      security:
        - engineToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferRequest'
      responses:
        '200':
          description: The plan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferPlan'
        '400':
          description: Invalid request (`files.invalid_path`, `files.into_itself`, `files.same_location`, `files.duplicate_names`, `files.not_a_directory`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid engine token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not allowed on a source or the destination (`files.forbidden`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: A source or the destination is missing (`files.not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/jobs/transfer:
    post:
      operationId: startTransfer
      summary: Copy or move entries in the background
      description: >-
        Same checks as the plan. Existing targets follow `strategy` unless `decisions` names one
        for that target. Overwriting needs `update` on the target, otherwise it is skipped.
      tags: [jobs]
      security:
        - engineToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferJobRequest'
      responses:
        '202':
          description: The job was queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          description: Invalid request (see the plan).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid engine token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not allowed (`files.forbidden`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: A source or the destination is missing (`files.not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many active jobs for this person (`jobs.too_many`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/fs/delete/plan:
    post:
      operationId: planDelete
      summary: Measure a deletion before doing it
      description: >-
        Sizes the selection (within a short time budget) and says whether it fits the trash
        limits; when it does not, the web app offers a permanent delete with a strong warning.
      tags: [files]
      security:
        - engineToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PathsRequest'
      responses:
        '200':
          description: The plan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletePlan'
        '400':
          description: Invalid paths or a volume itself (`files.invalid_path`, `files.volume_protected`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid engine token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: No `delete` permission on an item (`files.forbidden`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: An item is missing (`files.not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/fs/trash:
    post:
      operationId: moveToTrash
      summary: Move items to the trash
      description: >-
        Instant renames into each volume's trash. Needs `delete` on every item; volumes
        themselves cannot be deleted.
      tags: [files]
      security:
        - engineToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PathsRequest'
      responses:
        '200':
          description: Items now in the trash (ids allow undo).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrashItemList'
        '400':
          description: Invalid paths or a volume itself (`files.invalid_path`, `files.volume_protected`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid engine token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: No `delete` permission on an item (`files.forbidden`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: An item is missing (`files.not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/jobs/delete:
    post:
      operationId: startPermanentDelete
      summary: Delete items permanently
      description: Bypasses the trash. Same checks as moving to the trash; cannot be undone.
      tags: [jobs]
      security:
        - engineToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PathsRequest'
      responses:
        '202':
          description: The job was queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          description: Invalid paths or a volume itself (`files.invalid_path`, `files.volume_protected`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid engine token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: No `delete` permission on an item (`files.forbidden`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: An item is missing (`files.not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many active jobs (`jobs.too_many`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/trash:
    get:
      operationId: listTrash
      summary: Items in the trash
      description: The caller's own deletions (every item for administrators), newest first, with the limits.
      tags: [trash]
      security:
        - engineToken: []
      responses:
        '200':
          description: The trash.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrashListing'
        '401':
          description: Missing or invalid engine token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/trash/restore:
    post:
      operationId: restoreFromTrash
      summary: Put items back where they were
      description: Needs `create` at the original place; a name taken meanwhile keeps both.
      tags: [trash]
      security:
        - engineToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrashIdsRequest'
      responses:
        '200':
          description: Where each item went back.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestoredList'
        '401':
          description: Missing or invalid engine token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not allowed at the original place (`files.forbidden`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown item, or not the caller’s (`trash.not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Could not restore (`files.exists`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/jobs/empty-trash:
    post:
      operationId: startEmptyTrash
      summary: Remove trash items for good
      description: The given items, or every item the caller sees when `ids` is empty.
      tags: [jobs]
      security:
        - engineToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrashIdsRequest'
      responses:
        '202':
          description: The job was queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '401':
          description: Missing or invalid engine token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many active jobs (`jobs.too_many`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    engineToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived Ed25519 token signed by the web app (never by browsers).
  schemas:
    LivenessStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    ReadinessStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ready]
    Error:
      description: >-
        Shared error model. `code` is namespaced `<module>.<error>` and translated by the UI
        (`errors.<code>`); no human message is ever sent.
      type: object
      required: [code, params, requestId]
      properties:
        code:
          type: string
          pattern: '^[a-z]+\.[a-z_]+$'
          examples: [system.database_unavailable]
        params:
          description: Interpolation values for the translated message (strings or numbers).
          type: object
          additionalProperties: true
        requestId:
          type: string
    PathAction:
      type: string
      enum: [read, upload, create, update, move, copy, delete, download, share, execute]
    DirectoryEntry:
      type: object
      required: [name, path, kind, size, modified, actions, preview, thumbnail]
      properties:
        name:
          type: string
        path:
          description: Virtual path of the entry.
          type: string
        kind:
          type: string
          enum: [file, directory]
        size:
          description: Bytes (0 for folders).
          type: integer
          format: int64
        modified:
          type: string
          format: date-time
        actions:
          type: array
          items:
            $ref: '#/components/schemas/PathAction'
        preview:
          $ref: '#/components/schemas/PreviewKind'
        thumbnail:
          description: >-
            The engine can render a thumbnail for this file (`/v1/fs/thumbnail`): a supported
            image, or a video when ffmpeg is installed, with thumbnails turned on.
          type: boolean
    EntryProperties:
      type: object
      required: [entry, mode, permissions, link]
      properties:
        entry:
          $ref: '#/components/schemas/DirectoryEntry'
        mimeType:
          description: Media type guessed from the extension (files only, when known).
          type: string
        link:
          description: The entry is a symbolic link (`entry` describes its target; mode, owner and change time the link itself).
          type: boolean
        linkTarget:
          description: Target of a symbolic link when relative; absolute host paths are never sent.
          type: string
        mode:
          description: Type and permission bits as `ls -l` prints them, e.g. `drwxr-x---`.
          type: string
        permissions:
          description: Permission bits as a number (shown in octal, e.g. 750).
          type: integer
        uid:
          description: Numeric owner on the host.
          type: integer
          format: int64
        gid:
          description: Numeric group on the host.
          type: integer
          format: int64
        changed:
          description: Last change of the entry's metadata (permissions, owner, name).
          type: string
          format: date-time
    PreviewKind:
      description: >-
        How the file can be shown in the browser, decided by the engine from its extension
        (`none` for folders and unknown files: download only).
      type: string
      enum: [none, image, pdf, text, audio, video, html]
    SearchResults:
      type: object
      required: [path, entries]
      properties:
        path:
          type: string
        entries:
          type: array
          items:
            $ref: '#/components/schemas/DirectoryEntry'
        truncated:
          description: >-
            Set when the search stopped early: too many results, too many entries visited, or
            out of time. The entries are what was found until then.
          type: string
          enum: [results, visited, timeout]
    DirectoryListing:
      type: object
      required: [path, entries, total, actions]
      properties:
        path:
          type: string
        entries:
          type: array
          items:
            $ref: '#/components/schemas/DirectoryEntry'
        total:
          description: Visible entries in the whole folder (for pagination).
          type: integer
        actions:
          description: Path actions the caller holds on the listed folder itself.
          type: array
          items:
            $ref: '#/components/schemas/PathAction'
    ExplainRequest:
      type: object
      required: [userId, groups, admin, path]
      properties:
        userId:
          type: string
        groups:
          description: Ids of the person's groups.
          type: array
          items:
            type: string
        admin:
          description: The person holds `system:admin` (bypasses rules).
          type: boolean
        path:
          type: string
          maxLength: 4096
    DecidingGrant:
      type: object
      required: [id, subjectType, subjectId, path, effect]
      properties:
        id:
          type: string
        subjectType:
          type: string
          enum: [user, group]
        subjectId:
          type: string
        path:
          type: string
        effect:
          type: string
          enum: [allow, deny]
    AccessDecision:
      type: object
      required: [action, allowed, byAdmin]
      properties:
        action:
          $ref: '#/components/schemas/PathAction'
        allowed:
          type: boolean
        byAdmin:
          type: boolean
        grant:
          $ref: '#/components/schemas/DecidingGrant'
    ExplainResponse:
      type: object
      required: [path, decisions]
      properties:
        path:
          type: string
        decisions:
          type: array
          items:
            $ref: '#/components/schemas/AccessDecision'
    CompressRequest:
      type: object
      required: [sources, format]
      properties:
        sources:
          description: Items to archive, all in the same folder.
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: string
            maxLength: 4096
        format:
          type: string
          enum: [zip, tar.gz]
    ExtractRequest:
      type: object
      required: [path]
      properties:
        path:
          type: string
          maxLength: 4096
    ChecksumRequest:
      type: object
      required: [path, algorithm]
      properties:
        path:
          type: string
          maxLength: 4096
        algorithm:
          type: string
          enum: [md5, sha1, sha256, sha512]
    Plugin:
      type: object
      required: [id, version, repo, enabled, pinned, installedAt, name, description, commands]
      properties:
        id: { type: string }
        version: { type: string }
        repo:
          description: GitHub owner/name releases come from.
          type: string
        enabled: { type: boolean }
        pinned:
          description: Updates are not suggested.
          type: boolean
        installedAt:
          type: string
          format: date-time
        name:
          $ref: '#/components/schemas/LocalizedText'
        description:
          $ref: '#/components/schemas/LocalizedText'
        commands:
          description: Catalog commands the plugin adds.
          type: integer
    PluginList:
      type: object
      required: [platform, items]
      properties:
        platform:
          description: This engine's platform, as manifests name it (linux-amd64).
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/Plugin'
    MediaInfo:
      type: object
      required: [mode, streamable, duration]
      properties:
        mode:
          type: string
          enum: [direct, remux, transcode]
        streamable:
          description: The engine can stream a converted copy (ffmpeg is installed).
          type: boolean
        duration:
          description: Seconds; 0 when unknown.
          type: number
        video:
          description: Video codec (h264, hevc…), when known.
          type: string
        audio:
          description: First audio track's codec, when known.
          type: string
        width: { type: integer }
        height: { type: integer }
    PluginManifestText:
      type: object
      required: [manifest]
      properties:
        manifest:
          type: string
          maxLength: 65536
    PluginRelease:
      type: object
      required: [id, version, repo, name, description, commands, binaryAsset, checksumsAsset]
      properties:
        id: { type: string }
        version: { type: string }
        repo: { type: string }
        name:
          $ref: '#/components/schemas/LocalizedText'
        description:
          $ref: '#/components/schemas/LocalizedText'
        commands:
          type: integer
        binaryAsset:
          description: Release asset holding the binary for this engine's platform.
          type: string
        checksumsAsset:
          description: Release asset listing SHA-256 sums.
          type: string
    PluginFlags:
      type: object
      required: [enabled, pinned]
      properties:
        enabled: { type: boolean }
        pinned: { type: boolean }
    LocalizedText:
      type: object
      required: [en, fr, es]
      properties:
        en: { type: string }
        fr: { type: string }
        es: { type: string }
    CommandParam:
      type: object
      required: [name, type, label, required, secret]
      properties:
        name: { type: string }
        type:
          type: string
          enum: [path, bool, int, string, enum]
        label:
          $ref: '#/components/schemas/LocalizedText'
        access:
          description: Path parameters only.
          type: string
          enum: [read, create, update]
        required: { type: boolean }
        secret: { type: boolean }
        default: {}
        min: { type: integer, format: int64 }
        max: { type: integer, format: int64 }
        values:
          type: array
          items: { type: string }
    CommandPlugin:
      description: The plugin a command comes from (absent for built-in commands).
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name:
          $ref: '#/components/schemas/LocalizedText'
    CommandEntry:
      type: object
      required: [id, name, description, mode, params, dryRun]
      properties:
        plugin:
          $ref: '#/components/schemas/CommandPlugin'
        id: { type: string }
        name:
          $ref: '#/components/schemas/LocalizedText'
        description:
          $ref: '#/components/schemas/LocalizedText'
        mode:
          type: string
          enum: [basic, advanced]
        dryRun:
          description: The command can simulate a run.
          type: boolean
        params:
          type: array
          items:
            $ref: '#/components/schemas/CommandParam'
    CommandCatalog:
      type: object
      required: [advanced, entries]
      properties:
        advanced:
          description: Advanced mode is available to the caller.
          type: boolean
        entries:
          type: array
          items:
            $ref: '#/components/schemas/CommandEntry'
    CommandRequest:
      type: object
      required: [entry, params]
      properties:
        entry:
          type: string
          maxLength: 128
        params:
          description: Values by parameter name (paths are virtual paths).
          type: object
          additionalProperties: true
        dryRun:
          type: boolean
          default: false
    CommandPreview:
      type: object
      required: [binary, argv]
      properties:
        binary: { type: string }
        argv:
          type: array
          items: { type: string }
    FolderSizeRequest:
      type: object
      required: [path]
      properties:
        path:
          type: string
    JobState:
      type: string
      enum: [queued, running, succeeded, failed, cancelled]
    Job:
      type: object
      required: [id, kind, ownerId, state, bytesDone, itemsDone, createdAt]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          description: What the job does (`folder_size`, later copy, move, delete…).
        ownerId:
          type: string
        state:
          $ref: '#/components/schemas/JobState'
        target:
          type: string
          description: Virtual path the job works on.
        bytesDone:
          type: integer
          format: int64
        bytesTotal:
          type: integer
          format: int64
          description: Absent while still unknown.
        itemsDone:
          type: integer
          format: int64
        itemsTotal:
          type: integer
          format: int64
        currentPath:
          type: string
        rateBps:
          type: integer
          format: int64
        etaSeconds:
          type: integer
        result:
          type: object
          additionalProperties: true
          description: Human-readable outcome, shape depends on the kind.
        errorCode:
          type: string
          description: Set when the job failed; translated by the web app.
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
    JobList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Job'
    JobLogLine:
      type: object
      required: [seq, at, level, line]
      properties:
        seq:
          type: integer
        at:
          type: string
          format: date-time
        level:
          type: string
          enum: [info, warn, error]
        line:
          type: string
    JobLogList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/JobLogLine'
    CreateFolderRequest:
      type: object
      required: [path]
      properties:
        path:
          type: string
    RenameRequest:
      type: object
      required: [path, name]
      properties:
        path:
          type: string
        name:
          type: string
          description: New name, in the same folder.
    PathResult:
      type: object
      required: [path]
      properties:
        path:
          type: string
    TransferOperation:
      type: string
      enum: [copy, move]
    ConflictStrategy:
      type: string
      enum: [skip, overwrite, keep_both]
    TransferRequest:
      type: object
      required: [operation, sources, destination]
      properties:
        operation:
          $ref: '#/components/schemas/TransferOperation'
        sources:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: string
        destination:
          type: string
    TransferJobRequest:
      allOf:
        - $ref: '#/components/schemas/TransferRequest'
        - type: object
          required: [strategy]
          properties:
            strategy:
              $ref: '#/components/schemas/ConflictStrategy'
            decisions:
              type: object
              description: Strategy per target path, overriding `strategy`.
              additionalProperties:
                $ref: '#/components/schemas/ConflictStrategy'
    TransferConflict:
      type: object
      required: [source, target, sourceIsDirectory, targetIsDirectory, self]
      properties:
        source:
          type: string
        target:
          type: string
        sourceIsDirectory:
          type: boolean
        targetIsDirectory:
          type: boolean
        self:
          type: boolean
          description: A copy onto itself; only keep_both applies.
    TransferPlan:
      type: object
      required: [conflicts, truncated]
      properties:
        conflicts:
          type: array
          items:
            $ref: '#/components/schemas/TransferConflict'
        truncated:
          type: boolean
          description: More conflicts exist than listed.
    PathsRequest:
      type: object
      required: [paths]
      properties:
        paths:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: string
    TrashLimits:
      type: object
      required: [maxBytes, maxFiles, retentionDays]
      properties:
        maxBytes:
          type: integer
          format: int64
        maxFiles:
          type: integer
          format: int64
        retentionDays:
          type: integer
    DeletePlan:
      type: object
      required: [bytes, files, complete, fitsTrash, limits]
      properties:
        bytes:
          type: integer
          format: int64
        files:
          type: integer
          format: int64
        complete:
          type: boolean
          description: False when measuring took too long (very large selection).
        fitsTrash:
          type: boolean
        limits:
          $ref: '#/components/schemas/TrashLimits'
    TrashItem:
      type: object
      required: [id, name, originalPath, isDirectory, deletedAt, deletedBy, bytes, files, measured]
      properties:
        id:
          type: string
        name:
          type: string
        originalPath:
          type: string
        isDirectory:
          type: boolean
        deletedAt:
          type: string
          format: date-time
        deletedBy:
          type: string
        bytes:
          type: integer
          format: int64
        files:
          type: integer
          format: int64
        measured:
          type: boolean
    TrashItemList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TrashItem'
    TrashListing:
      type: object
      required: [items, limits]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TrashItem'
        limits:
          $ref: '#/components/schemas/TrashLimits'
    TrashIdsRequest:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          maxItems: 1000
          items:
            type: string
    RestoredItem:
      type: object
      required: [id, path]
      properties:
        id:
          type: string
        path:
          type: string
    RestoredList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RestoredItem'
