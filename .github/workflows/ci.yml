name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: TypeScript (format, lint, typecheck, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Start Postgres for integration tests
        run: |
          {
            echo "CANOPY_DB_ADMIN_PASSWORD=ci-admin"
            echo "CANOPY_WEB_DB_PASSWORD=ci-web"
            echo "CANOPY_ENGINE_DB_PASSWORD=ci-engine"
          } > docker/.env
          docker compose -f docker/compose.dev.yaml --env-file docker/.env up -d --wait
      - run: pnpm test
        env:
          CANOPY_TEST_WEB_DATABASE_URL: postgres://canopy_web:ci-web@127.0.0.1:5432/canopy
      - run: pnpm build

  checks:
    name: Repository checks (i18n, changelog)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:i18n
      - run: pnpm check:changelog

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/engine/go.mod
          cache-dependency-path: apps/engine/go.sum
      - name: pnpm audit (production dependencies)
        run: pnpm audit --prod --audit-level high
      - name: govulncheck
        working-directory: apps/engine
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  e2e:
    name: E2E (Playwright on the compose stack)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start the stack
        run: |
          # Secrets are generated by the setup step into docker/canopy (CANOPY_HOME).
          {
            echo "PUID=$(id -u)"
            echo "PGID=$(id -g)"
          } > docker/.env
          mkdir -p docker/data
          docker compose -f docker/compose.yaml --env-file docker/.env up -d --build --wait
      - run: pnpm --filter @canopy/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          CI: 'true'
      - name: Stack logs on failure
        if: failure()
        run: docker compose -f docker/compose.yaml --env-file docker/.env logs --no-color
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  contracts:
    name: Contracts (drift check)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/engine/go.mod
          cache-dependency-path: apps/engine/go.sum
      - run: pnpm install --frozen-lockfile
      - run: pnpm contracts:gen
      - name: Fail on drift
        run: |
          if ! git diff --exit-code -- packages/contracts apps/engine/internal/api; then
            echo "::error::Generated code is out of date. Run 'pnpm contracts:gen' and commit the result."
            exit 1
          fi

  docker:
    name: Docker (${{ matrix.image }} image)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        image: [web, engine]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/${{ matrix.image }}.Dockerfile
          push: false
          load: true
          tags: canopy-${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  engine:
    name: Go (lint, test, coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/engine/go.mod
          cache-dependency-path: apps/engine/go.sum
      # The pinned Docker image (version in the Makefile), as locally: pulled from Docker Hub, so a
      # GitHub release-download outage cannot block the lint.
      - name: Lint
        run: make lint
      - name: Start Postgres
        working-directory: .
        run: |
          {
            echo "CANOPY_DB_ADMIN_PASSWORD=ci-admin"
            echo "CANOPY_WEB_DB_PASSWORD=ci-web"
            echo "CANOPY_ENGINE_DB_PASSWORD=ci-engine"
          } > docker/.env
          docker compose -f docker/compose.dev.yaml --env-file docker/.env up -d --wait
      # The media runner and 7-Zip jobs are tested against the real programs; 7-Zip is the same
      # official static build as the engine images (docker/engine.Dockerfile, same checksum).
      - name: Install ffmpeg and 7-Zip
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
          curl -fsSL -o /tmp/7z.tar.xz https://github.com/ip7z/7zip/releases/download/26.05/7z2605-linux-x64.tar.xz
          echo "22cf82fcc6eb7474f1d5bb4f02c0f8ebd573a718089d6833dc30f8350a3b232e  /tmp/7z.tar.xz" | sha256sum -c -
          tar -xJf /tmp/7z.tar.xz -C /tmp 7zzs
          sudo install -m 0755 /tmp/7zzs /usr/local/bin/7zz
      - name: Test
        env:
          CANOPY_TEST_DATABASE_URL: postgres://canopy_engine:ci-engine@127.0.0.1:5432/canopy
        run: make test
      - run: make cover-gate
