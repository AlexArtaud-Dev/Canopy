name: Publish

# Runs when a release PR (see release.yml) lands on main: tags v<version>, creates the GitHub
# Release with notes rendered from changelog/releases/<version>.yaml, and pushes multi-arch images
# (amd64, arm64) to GHCR as <version> and latest, and to Docker Hub when a DOCKERHUB_TOKEN secret
# exists (one repository for both images: <version>-web, latest-web, <version>-engine, ...).
on:
  push:
    branches: [main]
    paths: ['changelog/releases/**']

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  release:
    name: Tag and GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Find the new release file
        id: version
        run: |
          file=$(git diff --name-only --diff-filter=A HEAD^ HEAD -- 'changelog/releases/*.yaml' | head -n 1)
          if [ -z "$file" ]; then
            echo "No new release file in this push: nothing to publish."
            exit 0
          fi
          echo "version=$(basename "$file" .yaml)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: steps.version.outputs.version != ''
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.version.outputs.version != ''
        with:
          node-version-file: .node-version
          cache: pnpm
      - if: steps.version.outputs.version != ''
        run: pnpm install --frozen-lockfile
      - name: Create the tag and the GitHub Release
        if: steps.version.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node scripts/release/notes.mjs "$VERSION" "$GITHUB_REPOSITORY" > notes.md
          gh release create "v${VERSION}" --target "$GITHUB_SHA" --title "v${VERSION}" --notes-file notes.md

  images:
    name: Images (${{ matrix.image }})
    needs: release
    if: needs.release.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { image: web, file: web, target: '' }
          - { image: engine, file: engine, target: '' }
          # The engine with ffmpeg: video thumbnails and in-browser playback of any video.
          - { image: engine-ffmpeg, file: engine, target: ffmpeg }
          # The engine with hardware video encoding (NVIDIA NVENC), on Debian.
          - { image: engine-gpu, file: engine, target: gpu }
    env:
      # Optional: without the secret, only GHCR receives the images.
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || 'izoniks' }}
      DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY || 'izoniks/canopy' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: env.DOCKERHUB_TOKEN != ''
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
      - name: Image tags
        id: tags
        env:
          IMAGE: ${{ matrix.image }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          ghcr="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/canopy-${IMAGE}"
          {
            echo "tags<<EOF"
            echo "${ghcr}:${VERSION}"
            echo "${ghcr}:latest"
            if [ -n "$DOCKERHUB_TOKEN" ]; then
              echo "${DOCKERHUB_REPOSITORY}:${VERSION}-${IMAGE}"
              echo "${DOCKERHUB_REPOSITORY}:latest-${IMAGE}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/${{ matrix.file }}.Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ needs.release.outputs.version }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.release.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-only
          cache-from: type=gha,scope=release-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.image }}
