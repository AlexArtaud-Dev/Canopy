version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ['type: chore', 'no-changelog']
    commit-message:
      prefix: chore
      include: scope
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: gomod
    directory: /apps/engine
    schedule:
      interval: weekly
    labels: ['type: chore', 'area: engine', 'no-changelog']
    commit-message:
      prefix: chore
      include: scope
    groups:
      go-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    labels: ['type: chore', 'area: docker', 'no-changelog']
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: ['type: ci', 'area: ci', 'no-changelog']
    commit-message:
      prefix: ci
