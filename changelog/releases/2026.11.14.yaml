date: 2026-11-13
entries:
  - type: fix
    scope: web
    issue: 176
    text:
      en: Canopy fits a phone screen - no page is wider than the screen any more, each file has a menu button on touch screens, and the operations panel starts folded.
      fr: Canopy tient dans un écran de téléphone - plus aucune page ne dépasse de l’écran, chaque fichier a un bouton de menu sur écran tactile, et le panneau des opérations démarre replié.
      es: Canopy cabe en la pantalla de un teléfono - ninguna página es ya más ancha que la pantalla, cada archivo tiene un botón de menú en pantallas táctiles, y el panel de operaciones empieza plegado.
  - type: fix
    scope: web
    issue: 177
    text:
      en: On a phone, dialogs rise from the bottom of the screen with their buttons always in reach, and the file viewer fills the screen.
      fr: Sur téléphone, les boîtes de dialogue montent du bas de l’écran avec leurs boutons toujours à portée, et la visionneuse de fichiers occupe tout l’écran.
      es: En el teléfono, los diálogos suben desde la parte inferior de la pantalla con sus botones siempre a mano, y el visor de archivos ocupa toda la pantalla.
  - type: fix
    scope: access
    issue: 182
    text:
      en: Built-in roles are described in your language.
      fr: Les rôles intégrés sont décrits dans votre langue.
      es: Los roles integrados se describen en su idioma.
