date: 2026-11-09
entries:
  - type: feat
    scope: shell
    issue: 2
    text:
      en: New app layout with a collapsible sidebar, light and dark themes and a language picker
      fr: Nouvelle mise en page avec barre latérale repliable, thèmes clair et sombre et choix de la langue
      es: Nuevo diseño con barra lateral plegable, temas claro y oscuro y selector de idioma
  - type: feat
    scope: system
    issue: 2
    text:
      en: System status page showing the health of the web app, the engine and the database
      fr: Page d’état du système indiquant la santé de l’application web, de l’engine et de la base de données
      es: Página de estado del sistema con la salud de la aplicación web, el engine y la base de datos
  - type: feat
    scope: docker
    issue: 5
    text:
      en: Production Docker images and a hardened compose stack (non-root, read-only, isolated network)
      fr: Images Docker de production et stack compose durcie (non-root, lecture seule, réseau isolé)
      es: Imágenes Docker de producción y stack compose reforzado (sin root, solo lectura, red aislada)
  - type: feat
    scope: errors
    issue: 21
    text:
      en: Clear error and not-found pages with a retry button and a reference to share with your administrator
      fr: Pages d’erreur et de page introuvable claires, avec un bouton Réessayer et une référence à transmettre à votre administrateur
      es: Páginas de error y de página no encontrada claras, con un botón Reintentar y una referencia para su administrador
  - type: security
    scope: web
    issue: 26
    text:
      en: Strict Content Security Policy, hardened HTTP headers and rate limiting
      fr: Politique de sécurité du contenu stricte, en-têtes HTTP renforcés et limitation du débit
      es: Política de seguridad de contenido estricta, cabeceras HTTP reforzadas y limitación de peticiones
  - type: feat
    scope: auth
    issue: 27
    text:
      en: Sign in with a username and password; sessions expire after inactivity and after a maximum lifetime
      fr: Connexion par nom d’utilisateur et mot de passe ; les sessions expirent après inactivité et au-delà d’une durée maximale
      es: Inicio de sesión con nombre de usuario y contraseña; las sesiones caducan por inactividad y tras una duración máxima
  - type: feat
    scope: auth
    issue: 28
    text:
      en: First-run setup wizard to create the administrator, available only from the local network
      fr: Assistant de premier lancement pour créer l’administrateur, accessible uniquement depuis le réseau local
      es: Asistente de primer arranque para crear el administrador, disponible solo desde la red local
  - type: feat
    scope: auth
    issue: 29
    text:
      en: Accounts lock for a while after repeated failed sign-ins, and the password policy is configurable
      fr: Les comptes sont bloqués un moment après plusieurs échecs de connexion, et la politique de mot de passe est configurable
      es: Las cuentas se bloquean un tiempo tras varios intentos fallidos y la política de contraseñas es configurable
  - type: feat
    scope: auth
    issue: 30
    text:
      en: Two-factor authentication with an authenticator app, plus one-time recovery codes
      fr: Double authentification avec une application d’authentification, et codes de secours à usage unique
      es: Verificación en dos pasos con una aplicación de autenticación y códigos de recuperación de un solo uso
  - type: feat
    scope: auth
    issue: 31
    text:
      en: Account page to edit your profile, change your password and sign out other devices
      fr: Page Compte pour modifier votre profil, changer votre mot de passe et déconnecter vos autres appareils
      es: Página de cuenta para editar tu perfil, cambiar tu contraseña y cerrar sesión en otros dispositivos
  - type: fix
    scope: auth
    issue: 29
    text:
      en: Addresses that fail to sign in too often are blocked for an hour, and the password reveal button no longer jumps when pressed
      fr: Les adresses qui échouent trop souvent à se connecter sont bloquées une heure, et le bouton d’affichage du mot de passe ne saute plus au clic
      es: Las direcciones que fallan demasiadas veces al iniciar sesión se bloquean durante una hora, y el botón para mostrar la contraseña ya no salta al pulsarlo
  - type: feat
    scope: admin
    issue: 33
    text:
      en: Administrators can create, edit, disable and delete users, reset their password or two-factor, and assign roles
      fr: Les administrateurs peuvent créer, modifier, désactiver et supprimer des utilisateurs, réinitialiser leur mot de passe ou leur double authentification, et attribuer des rôles
      es: Los administradores pueden crear, editar, desactivar y eliminar usuarios, restablecer su contraseña o su verificación en dos pasos y asignar roles
  - type: feat
    scope: admin
    issue: 34
    text:
      en: Manage roles with a permission matrix and groups of users, including groups that require two-factor authentication
      fr: Gestion des rôles avec une matrice de permissions et des groupes d’utilisateurs, y compris des groupes qui exigent la double authentification
      es: Gestión de roles con una matriz de permisos y de grupos de usuarios, incluidos grupos que exigen la verificación en dos pasos
  - type: feat
    scope: admin
    issue: 35
    text:
      en: Pages you are not allowed to open now show a clear “Access denied” message
      fr: Les pages que vous n’êtes pas autorisé à ouvrir affichent désormais un message « Accès refusé » clair
      es: Las páginas que no puedes abrir muestran ahora un mensaje claro de «Acceso denegado»
  - type: feat
    scope: admin
    issue: 87
    text:
      en: Group members are managed on a dedicated page, separate from the group settings
      fr: Les membres d’un groupe se gèrent sur une page dédiée, séparée des réglages du groupe
      es: Los miembros de un grupo se gestionan en una página propia, separada de los ajustes del grupo
  - type: feat
    scope: files
    issue: 54
    text:
      en: Administrators decide which folders each user and group can reach, and what they may do there
      fr: Les administrateurs décident des dossiers accessibles à chaque utilisateur et groupe, et de ce qu’ils peuvent y faire
      es: Los administradores deciden a qué carpetas llega cada usuario y grupo, y qué pueden hacer en ellas
  - type: feat
    scope: mail
    issue: 36
    text:
      en: Configure SMTP from Administration › Email, send a test message and follow recent deliveries
      fr: Configuration du SMTP dans Administration › E-mail, envoi d’un message de test et suivi des envois récents
      es: Configura el SMTP en Administración › Correo, envía un mensaje de prueba y sigue los envíos recientes
  - type: feat
    scope: mail
    issue: 38
    text:
      en: Invitation and password reset emails, a forgot-password page, and security notices for password, two-factor and new sign-ins
      fr: E-mails d’invitation et de réinitialisation de mot de passe, page « mot de passe oublié », et alertes de sécurité pour le mot de passe, la double authentification et les nouvelles connexions
      es: Correos de invitación y de restablecimiento de contraseña, página de contraseña olvidada y avisos de seguridad sobre contraseña, verificación en dos pasos y nuevos inicios de sesión
  - type: feat
    scope: settings
    issue: 39
    text:
      en: Administration › Settings lets administrators search and change instance settings, see what was modified and reset to defaults
      fr: Administration › Réglages permet de rechercher et modifier les réglages de l’instance, de voir ce qui a été modifié et de revenir aux valeurs par défaut
      es: Administración › Ajustes permite buscar y cambiar los ajustes de la instancia, ver qué se modificó y volver a los valores por defecto
  - type: feat
    scope: audit
    issue: 40
    text:
      en: Browse the audit log with filters, export it as CSV, and keep it only as long as the retention setting says
      fr: Consultation du journal d’audit avec filtres, export CSV, et conservation limitée à la durée réglée
      es: Consulta el registro de auditoría con filtros, expórtalo en CSV y consérvalo solo el tiempo configurado
  - type: feat
    scope: system
    issue: 41
    text:
      en: Maintenance mode, switched on from the local network, shows a maintenance page to everyone else
      fr: Le mode maintenance, activable depuis le réseau local, affiche une page de maintenance à tous les autres
      es: El modo mantenimiento, activable desde la red local, muestra una página de mantenimiento a todos los demás
  - type: feat
    scope: privacy
    issue: 42
    text:
      en: Download your personal data from the Account page; administrators can export it for anyone, and old emails are deleted after a retention period
      fr: Téléchargement de vos données personnelles depuis la page Compte ; les administrateurs peuvent les exporter pour chacun, et les anciens e-mails sont supprimés après une durée de conservation
      es: Descarga tus datos personales desde la página Cuenta; los administradores pueden exportarlos de cualquiera y los correos antiguos se borran tras un periodo de conservación
  - type: feat
    scope: appearance
    issue: 43
    text:
      en: Choose the instance color theme, the default light or dark mode and the default language in Settings
      fr: Choix du thème de couleur de l’instance, du mode clair ou sombre par défaut et de la langue par défaut dans les Réglages
      es: Elige el tema de color de la instancia, el modo claro u oscuro por defecto y el idioma por defecto en Ajustes
  - type: feat
    scope: shell
    issue: 2
    text:
      en: The browser tab shows the Canopy logo
      fr: L’onglet du navigateur affiche le logo Canopy
      es: La pestaña del navegador muestra el logo de Canopy
  - type: feat
    scope: files
    issue: 100
    text:
      en: Folder access rules can be edited, not only added and removed
      fr: Les règles d’accès aux dossiers peuvent être modifiées, et plus seulement ajoutées ou retirées
      es: Las reglas de acceso a carpetas se pueden editar, no solo añadir y quitar
  - type: feat
    scope: admin
    issue: 103
    text:
      en: Each user has an access page tracing their permissions to roles and groups, with a folder check showing which rule decides; groups have separate members and folder access pages
      fr: Chaque utilisateur a une page d’accès qui relie ses permissions à ses rôles et groupes, avec une vérification de dossier montrant quelle règle décide ; les groupes ont des pages séparées pour les membres et l’accès aux dossiers
      es: Cada usuario tiene una página de acceso que relaciona sus permisos con sus roles y grupos, con una comprobación de carpeta que muestra qué regla decide; los grupos tienen páginas separadas para miembros y acceso a carpetas
  - type: feat
    scope: engine
    issue: 48
    text:
      en: Long operations run as background jobs with live progress, cancellation and per-person limits configurable in Settings
      fr: Les opérations longues s’exécutent en tâches de fond, avec progression en direct, annulation et limites par personne réglables dans les Réglages
      es: Las operaciones largas se ejecutan como tareas en segundo plano, con progreso en directo, cancelación y límites por persona configurables en Ajustes
  - type: feat
    scope: files
    issue: 49
    text:
      en: Browse your folders in a list or grid that stays fast with thousands of files, with sorting, multi-selection, keyboard shortcuts and a right-click menu
      fr: Parcourez vos dossiers en liste ou en grille, fluide même avec des milliers de fichiers, avec tri, sélection multiple, raccourcis clavier et menu contextuel
      es: Explora tus carpetas en lista o cuadrícula, fluida incluso con miles de archivos, con orden, selección múltiple, atajos de teclado y menú contextual
  - type: feat
    scope: files
    issue: 50
    text:
      en: An operations panel follows long tasks live (progress, speed, time left, current file) with cancel and retry, and folders can be measured from their menu
      fr: Un panneau des opérations suit les tâches longues en direct (progression, vitesse, temps restant, fichier en cours) avec annulation et relance, et la taille d’un dossier se calcule depuis son menu
      es: Un panel de operaciones sigue las tareas largas en directo (progreso, velocidad, tiempo restante, archivo actual) con cancelación y reintento, y el tamaño de una carpeta se calcula desde su menú
  - type: feat
    scope: files
    issue: 51
    text:
      en: Create folders, rename, and copy or move items with a folder picker, Ctrl+C/X/V or drag and drop; taken names are never overwritten without your choice
      fr: Créez des dossiers, renommez, et copiez ou déplacez des éléments via un sélecteur de dossier, Ctrl+C/X/V ou le glisser-déposer ; un nom déjà pris n’est jamais écrasé sans votre choix
      es: Crea carpetas, cambia nombres y copia o mueve elementos con un selector de carpetas, Ctrl+C/X/V o arrastrando; un nombre ya usado nunca se sobrescribe sin tu elección
  - type: fix
    scope: files
    issue: 51
    text:
      en: Dropping items on a folder in the list moves them into it, the drag badge follows the pointer, and notifications no longer cover the operations panel
      fr: Déposer des éléments sur un dossier de la liste les y déplace, le badge de glisser suit le pointeur, et les notifications ne couvrent plus le panneau des opérations
      es: Soltar elementos sobre una carpeta de la lista los mueve dentro, la etiqueta de arrastre sigue al puntero y las notificaciones ya no tapan el panel de operaciones
  - type: feat
    scope: files
    issue: 52
    text:
      en: Download files, or folders and selections as a zip streamed on the fly; downloads can be resumed
      fr: Téléchargez des fichiers, ou des dossiers et sélections en zip généré à la volée ; les téléchargements peuvent reprendre
      es: Descarga archivos, o carpetas y selecciones como zip generado al vuelo; las descargas se pueden reanudar
  - type: feat
    scope: files
    issue: 52
    text:
      en: Upload files and whole folders with the Upload button or by dropping them on the list; large uploads resume after network drops, and administrators can cap file size and block file types
      fr: Importez des fichiers et des dossiers entiers avec le bouton Importer ou en les déposant sur la liste ; les gros imports reprennent après une coupure réseau, et les administrateurs peuvent limiter la taille et bloquer des types de fichiers
      es: Sube archivos y carpetas enteras con el botón Subir o soltándolos en la lista; las subidas grandes se reanudan tras un corte de red, y los administradores pueden limitar el tamaño y bloquear tipos de archivo
  - type: feat
    scope: files
    issue: 53
    text:
      en: Deleted items go to a trash you can undo or restore from; it is capped per volume in size and number of files, and anything too large is deleted permanently only after a clear warning
      fr: Les éléments supprimés vont dans une corbeille d’où l’on peut annuler ou restaurer ; sa taille et son nombre de fichiers sont limités par volume, et ce qui est trop gros n’est supprimé définitivement qu’après un avertissement clair
      es: Los elementos eliminados van a una papelera desde la que se puede deshacer o restaurar; su tamaño y número de archivos están limitados por volumen, y lo que es demasiado grande solo se elimina definitivamente tras un aviso claro
  - type: feat
    scope: files
    issue: 55
    text:
      en: Preview images, PDFs, text and code (with syntax highlighting), audio and video without leaving the folder
      fr: Aperçu des images, PDF, textes et code (avec coloration syntaxique), audio et vidéo sans quitter le dossier
      es: Vista previa de imágenes, PDF, texto y código (con resaltado de sintaxis), audio y vídeo sin salir de la carpeta
  - type: feat
    scope: files
    issue: 56
    text:
      en: Thumbnails for images and videos in the grid view, cached by the server, with a setting to turn them off
      fr: Miniatures des images et vidéos en vue grille, mises en cache par le serveur, avec un réglage pour les désactiver
      es: Miniaturas de imágenes y vídeos en la vista de cuadrícula, en caché en el servidor, con un ajuste para desactivarlas
  - type: feat
    scope: files
    issue: 57
    text:
      en: Search file and folder names in the current folder and its subfolders, ignoring case and accents
      fr: Recherche des noms de fichiers et dossiers dans le dossier courant et ses sous-dossiers, sans tenir compte de la casse ni des accents
      es: Búsqueda de nombres de archivos y carpetas en la carpeta actual y sus subcarpetas, sin distinguir mayúsculas ni acentos
  - type: feat
    scope: files
    issue: 58
    text:
      en: Compress items to zip or tar.gz, extract archives safely, and compute file checksums, with live progress
      fr: Compression en zip ou tar.gz, extraction sécurisée des archives et calcul de sommes de contrôle, avec progression en direct
      es: Compresión en zip o tar.gz, extracción segura de archivos comprimidos y cálculo de sumas de verificación, con progreso en directo
  - type: feat
    scope: shares
    issue: 59
    text:
      en: Share links to files and folders, with expiry, optional password and download limit, and a page to manage or revoke them
      fr: Liens de partage vers des fichiers et dossiers, avec expiration, mot de passe et limite de téléchargements facultatifs, et une page pour les gérer ou les révoquer
      es: Enlaces para compartir archivos y carpetas, con caducidad, contraseña y límite de descargas opcionales, y una página para gestionarlos o revocarlos
  - type: feat
    scope: shares
    issue: 121
    text:
      en: Upload links let people without an account send files into a folder, with optional password, allowed types and size limits
      fr: Les liens de dépôt permettent à des personnes sans compte d’envoyer des fichiers dans un dossier, avec mot de passe, types autorisés et limites de taille facultatifs
      es: Los enlaces de subida permiten a personas sin cuenta enviar archivos a una carpeta, con contraseña, tipos permitidos y límites de tamaño opcionales
  - type: feat
    scope: commands
    issue: 61
    text:
      en: A Commands page runs tools installed on the server from a catalog, showing the exact command, a dry run and live output
      fr: Une page Commandes lance des outils installés sur le serveur depuis un catalogue, avec la commande exacte, une simulation et la sortie en direct
      es: Una página Comandos ejecuta herramientas instaladas en el servidor desde un catálogo, con el comando exacto, una simulación y la salida en directo
  - type: feat
    scope: plugins
    issue: 62
    text:
      en: Administrators install, update, pin and remove plugins from allowed GitHub repositories; every download is checked against the release checksums
      fr: Les administrateurs installent, mettent à jour, figent et retirent des plugins issus de dépôts GitHub autorisés ; chaque téléchargement est vérifié avec les sommes de contrôle de la version
      es: Los administradores instalan, actualizan, fijan y quitan plugins de repositorios de GitHub permitidos; cada descarga se comprueba con las sumas de verificación de la versión
  - type: feat
    scope: plugins
    issue: 62
    text:
      en: Right-click a folder or empty space to run a plugin command in a dialog with the folder already filled in; the files refresh when it ends
      fr: Un clic droit sur un dossier ou dans le vide lance une commande de plugin dans une fenêtre où le dossier est déjà rempli ; les fichiers s’actualisent à la fin
      es: Un clic derecho en una carpeta o en un espacio vacío ejecuta un comando de plugin en una ventana con la carpeta ya indicada; los archivos se actualizan al terminar
  - type: feat
    scope: shell
    issue: 129
    text:
      en: The sidebar groups administration pages into collapsible sections, and settings are organized in vertical tabs by category
      fr: La barre latérale regroupe les pages d’administration en sections repliables, et les réglages sont rangés en onglets verticaux par catégorie
      es: La barra lateral agrupa las páginas de administración en secciones plegables y los ajustes se ordenan en pestañas verticales por categoría
  - type: feat
    scope: whats-new
    issue: 65
    text:
      en: A What's new page lists the changes of each version in your language, with a badge when a new version is out
      fr: Une page Quoi de neuf liste les changements de chaque version dans votre langue, avec un badge quand une nouvelle version sort
      es: Una página Novedades muestra los cambios de cada versión en tu idioma, con una insignia cuando sale una nueva versión
  - type: docs
    scope: docs
    issue: 66
    text:
      en: A user guide covers install, folders and permissions, reverse proxy, upgrades, backups and troubleshooting
      fr: Un guide d’utilisation couvre l’installation, les dossiers et permissions, le reverse proxy, les mises à jour, les sauvegardes et le dépannage
      es: Una guía de uso cubre la instalación, las carpetas y permisos, el proxy inverso, las actualizaciones, las copias de seguridad y la resolución de problemas
  - type: fix
    scope: a11y
    issue: 67
    text:
      en: Better accessibility - stronger text contrast, clearer account and sort labels, and file rows that screen readers announce correctly
      fr: Meilleure accessibilité - contraste du texte renforcé, libellés plus clairs pour le compte et le tri, et lignes de fichiers correctement annoncées par les lecteurs d’écran
      es: Mejor accesibilidad - más contraste en el texto, etiquetas más claras para la cuenta y el orden, y filas de archivos anunciadas correctamente por los lectores de pantalla
  - type: security
    scope: engine
    issue: 67
    text:
      en: Upload and trash identifiers can no longer point outside the file root
      fr: Les identifiants d’envoi et de corbeille ne peuvent plus désigner un dossier hors de la racine des fichiers
      es: Los identificadores de subida y de papelera ya no pueden apuntar fuera de la raíz de archivos
  - type: feat
    scope: docker
    issue: 139
    text:
      en: Install with a single folder - the first start creates its sub-folders and generates every password and key, no secret to write by hand
      fr: Installation avec un seul dossier - le premier démarrage crée ses sous-dossiers et génère tous les mots de passe et clés, aucun secret à écrire à la main
      es: Instalación con una sola carpeta - el primer arranque crea sus subcarpetas y genera todas las contraseñas y claves, sin ningún secreto que escribir a mano
  - type: fix
    scope: a11y
    issue: 67
    text:
      en: Red action buttons are easier to read
      fr: Les boutons d’action rouges sont plus lisibles
      es: Los botones de acción rojos se leen mejor
