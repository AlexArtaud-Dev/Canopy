date: 2026-11-14
entries:
  - type: feat
    scope: shares
    issue: 214
    text:
      en: Upload links can ask who sends files - nothing, a name and e-mail, or an e-mail verified by a code; the Shares page lists each drop-off with its files, and records can be erased.
      fr: Les liens de dépôt peuvent demander qui envoie - rien, un nom et un e-mail, ou un e-mail vérifié par un code ; la page Partages liste chaque dépôt avec ses fichiers, et les enregistrements peuvent être effacés.
      es: Los enlaces de depósito pueden pedir quién envía - nada, un nombre y un correo, o un correo verificado con un código; la página Compartidos lista cada depósito con sus archivos, y los registros se pueden borrar.
