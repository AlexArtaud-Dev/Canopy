entries:
  - type: feat
    scope: shell
    issue: 2
    text:
      en: New app layout with a collapsible sidebar, light and dark themes and a language picker
      fr: Nouvelle mise en page avec barre latérale repliable, thèmes clair et sombre et choix de la langue
      es: Nuevo diseño con barra lateral plegable, temas claro y oscuro y selector de idioma
  - type: feat
    scope: system
    issue: 2
    text:
      en: System status page showing the health of the web app, the engine and the database
      fr: Page d’état du système indiquant la santé de l’application web, de l’engine et de la base de données
      es: Página de estado del sistema con la salud de la aplicación web, el engine y la base de datos
  - type: feat
    scope: docker
    issue: 5
    text:
      en: Production Docker images and a hardened compose stack (non-root, read-only, isolated network)
      fr: Images Docker de production et stack compose durcie (non-root, lecture seule, réseau isolé)
      es: Imágenes Docker de producción y stack compose reforzado (sin root, solo lectura, red aislada)
  - type: feat
    scope: errors
    issue: 21
    text:
      en: Clear error and not-found pages with a retry button and a reference to share with your administrator
      fr: Pages d’erreur et de page introuvable claires, avec un bouton Réessayer et une référence à transmettre à votre administrateur
      es: Páginas de error y de página no encontrada claras, con un botón Reintentar y una referencia para su administrador
  - type: security
    scope: web
    issue: 26
    text:
      en: Strict Content Security Policy, hardened HTTP headers and rate limiting
      fr: Politique de sécurité du contenu stricte, en-têtes HTTP renforcés et limitation du débit
      es: Política de seguridad de contenido estricta, cabeceras HTTP reforzadas y limitación de peticiones
  - type: feat
    scope: auth
    issue: 27
    text:
      en: Sign in with a username and password; sessions expire after inactivity and after a maximum lifetime
      fr: Connexion par nom d’utilisateur et mot de passe ; les sessions expirent après inactivité et au-delà d’une durée maximale
      es: Inicio de sesión con nombre de usuario y contraseña; las sesiones caducan por inactividad y tras una duración máxima
  - type: feat
    scope: auth
    issue: 28
    text:
      en: First-run setup wizard to create the administrator, available only from the local network
      fr: Assistant de premier lancement pour créer l’administrateur, accessible uniquement depuis le réseau local
      es: Asistente de primer arranque para crear el administrador, disponible solo desde la red local
