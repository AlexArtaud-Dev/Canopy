packages:
  - apps/*
  - packages/*
allowBuilds:
  '@parcel/watcher': false
  '@swc/core': false
  esbuild: true
minimumReleaseAgeExclude:
  - nodemailer@10.4.0
# Security floors for transitive dev tooling (Dependabot alerts); drop once parents catch up.
overrides:
  'js-yaml@>=4 <4.3.2': ^4.3.2
  'esbuild@<0.25.0': ^0.25.12
  'minimatch@>=7 <11.0.1': ^11.0.1
  'glob@>=9 <14.0.2': ^14.0.2
